# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Actions externes épinglées par SHA complet ; le tag est indiqué en commentaire.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Conventions du dépôt
        run: python3 scripts/check_repo.py
      - name: Tests unitaires
        run: python3 -m unittest discover -s tests/unit -v
