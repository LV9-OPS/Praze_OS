# Construit deux fois le même commit et compare les SHA-256 (ticket B-04).
# Lancement manuel ; aussi déclenché quand ce fichier ou les épinglages changent.
name: iso-repro

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/iso-repro.yml"
      - ".github/workflows/iso-build.yml"

permissions:
  contents: read

jobs:
  build-a:
    uses: ./.github/workflows/iso-build.yml
    with:
      artifact-name: lv8-os-iso-repro-a
  build-b:
    uses: ./.github/workflows/iso-build.yml
    with:
      artifact-name: lv8-os-iso-repro-b

  compare:
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    steps:
      - name: Comparaison des SHA-256
        env:
          A: ${{ needs.build-a.outputs.sha256 }}
          B: ${{ needs.build-b.outputs.sha256 }}
        run: |
          echo "A: $A"
          echo "B: $B"
          if [ -n "$A" ] && [ "$A" = "$B" ]; then
            echo "Construction reproductible au bit près."
          else
            echo "::error::Les deux constructions diffèrent ; comparer les artefacts avec diffoscope."
            exit 1
          fi
