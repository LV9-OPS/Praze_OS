# SPDX-License-Identifier: GPL-3.0-or-later
# Construit deux fois le même commit et compare les SHA-256 (ticket B-04).
# Lancement manuel ; aussi déclenché quand ce fichier ou les épinglages changent.
name: iso-repro

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/iso-repro.yml"
      - ".github/workflows/iso-build.yml"
      - "build/iso/manifest.sh"

permissions:
  contents: read

jobs:
  build-a:
    uses: ./.github/workflows/iso-build.yml
    with:
      artifact-name: lv8-os-iso-repro-a
      manifest: true
  build-b:
    uses: ./.github/workflows/iso-build.yml
    with:
      artifact-name: lv8-os-iso-repro-b
      manifest: true

  compare:
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lv8-os-iso-repro-*-manifest
      - name: Comparaison
        env:
          A: ${{ needs.build-a.outputs.sha256 }}
          B: ${{ needs.build-b.outputs.sha256 }}
        run: |
          # Les annotations restent lisibles sans connexion, contrairement aux journaux.
          echo "::notice title=SHA-256 A::$A"
          echo "::notice title=SHA-256 B::$B"
          if [ -n "$A" ] && [ "$A" = "$B" ]; then
            echo "Construction reproductible au bit près."
            exit 0
          fi
          diff lv8-os-iso-repro-a-manifest/manifest.txt lv8-os-iso-repro-b-manifest/manifest.txt > manifest.diff || true
          annotate() {
            # %, CR et LF doivent être encodés dans un message d'annotation.
            lines=$(cat)
            body=$(printf '%s\n' "$lines" | head -n 60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$1 ($(printf '%s\n' "$lines" | grep -c .) lignes)::$body"
          }
          # Lignes d'empreinte (« section sha256  chemin ») : le contenu diffère.
          grep -E '^[<>] (iso|root) [0-9a-f]{64}  ' manifest.diff | annotate "Contenu différent" || true
          # Lignes de métadonnées du système live (droits, propriétaire, mtime, taille).
          grep -E '^[<>] root [a-z] ' manifest.diff | annotate "Métadonnées airootfs" || true
          grep -E '^[<>] iso [a-z] ' manifest.diff | annotate "Métadonnées ISO" || true
          exit 1
