name: iso

on:
  pull_request:
    paths:
      - "build/iso/**"
      - "tests/vm/**"
      - ".github/workflows/iso.yml"
      - ".github/workflows/iso-build.yml"
  push:
    paths:
      - "build/iso/**"
      - "tests/vm/**"
      - ".github/workflows/iso.yml"
      - ".github/workflows/iso-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    uses: ./.github/workflows/iso-build.yml
    with:
      artifact-name: lv8-os-iso

  boot-iso:
    needs: build-iso
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lv8-os-iso
          path: out
      - name: Intégrité de l'ISO
        working-directory: out
        run: sha256sum -c SHA256SUMS
      - name: QEMU, OVMF et KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Démarrage ${{ matrix.firmware }}
        run: python3 tests/vm/boot_iso.py out/*.iso --firmware ${{ matrix.firmware }} --log boot-${{ matrix.firmware }}.log
      - name: Journal série
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boot-${{ matrix.firmware }}-log
          path: boot-${{ matrix.firmware }}.log
          retention-days: 7
