# SPDX-License-Identifier: GPL-3.0-or-later
name: iso

on:
  pull_request:
    paths:
      - "build/iso/**"
      - ".github/workflows/iso.yml"
  push:
    paths:
      - "build/iso/**"
      - ".github/workflows/iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # shortcut: image non épinglée, construction non reproductible au bit près ; épingler par digest au Jalon B-04.
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Dépendances
        run: pacman -Syu --noconfirm --needed archiso git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Construction de l'ISO
        # bash = -eo pipefail : un échec de build.sh n'est pas masqué par tee.
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          mkdir -p out
          bash build/iso/build.sh out 2>&1 | tee out/build.log
      - name: Artefacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lv8-os-iso
          path: |
            out/*.iso
            out/SHA256SUMS
            out/build-info.txt
          retention-days: 3
          if-no-files-found: error
      - name: Journaux d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lv8-os-iso-logs
          path: out/build.log
          retention-days: 7
